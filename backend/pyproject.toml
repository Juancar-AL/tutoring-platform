[project]
name = "tutoring"
version = "0.1.0"
description = "Backend API for a tutoring management platform"
readme = "README.md"
authors = [
    { name = "Juancar-AL", email = "jc07alonso@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
